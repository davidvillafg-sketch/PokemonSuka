<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#1e272c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pokemon Suka">
<meta name="app-version" content="18">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-180.png">

<title>Pokemon Custom VGC Battle</title>
<link rel="stylesheet" href="./styles.css">

</head>
<body>

<div id="select-screen" class="screen">
    <h2>Seleziona la squadra (4 Pokémon ciascuno)</h2>
    <h3 id="selector-title" style="color: #2ecc71;">Turno: Giocatore 1 (Selezionati: 0/4)</h3>
    <div id="roster-grid" class="roster-grid"></div>
    <button id="confirm-selection" disabled onclick="confirmPlayerSelection()" style="padding: 12px; font-size: 1.1em; background: #27ae60;">Conferma Squadra Giocatore 1</button>
</div>

<div id="battle-screen" class="screen hidden">
    <div class="field-status" id="field-status-bar"></div>
    <div class="battleboard">
        <div class="trainer-side">
            <h3 id="p1-name-label">Giocatore 1</h3>
            <div class="active-slot" id="p1-slot-0"></div>
            <div class="active-slot" id="p1-slot-1"></div>
        </div>
        <div class="trainer-side">
            <h3 id="p2-name-label">Giocatore 2</h3>
            <div class="active-slot" id="p2-slot-0"></div>
            <div class="active-slot" id="p2-slot-1"></div>
        </div>
    </div>
    <div id="log"></div>
    <div class="controls-area" id="controls-area">
        <div>
            <h4 id="current-actor-label">Tocca a: -</h4>
            <div class="moves-grid" id="moves-grid"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px; justify-content: center;">
            <button class="secondary-btn" onclick="openSwitchMenu()">Cambia Pokémon</button>
            <button class="secondary-btn quit-battle-btn" onclick="quitBattle()">Abbandona battaglia</button>
        </div>
    </div>
</div>

<div id="modal-root"></div>

<script src="./pokemon-images.js?v=18"></script>
<script src="./game.js?v=game-v18"></script>

<script src="./pwa.js"></script>

</body>
</html>
